<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cauca — Revista Digital del Bajo Cauca Antioqueño</title>

    <meta name="theme-color" content="#1A3A2A">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --oro: #C8962A; --oro-claro: #E8B84B; --verde-selva: #1A3A2A;
            --crema: #F5EDD8; --crema-oscuro: #E8D5B0; --texto: #1A1A18; --blanco: #FAFAF7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Source Serif 4', serif; background: var(--crema); color: var(--texto); }
        header { background: var(--verde-selva); border-bottom: 4px solid var(--oro); position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; padding: 8px 24px; font-size: 0.72rem; color: var(--crema-oscuro); border-bottom: 1px solid rgba(200,150,42,0.2); }
        .header-main { padding: 20px; text-align: center; }
        .revista-nombre { font-family: 'Bebas Neue', sans-serif; font-size: 4rem; color: var(--crema); letter-spacing: 0.1em; }
        nav.secciones { display: flex; justify-content: center; background: rgba(0,0,0,0.2); }
        nav.secciones button { background: none; border: none; color: var(--crema-oscuro); padding: 15px 20px; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        nav.secciones button.activo { color: var(--oro-claro); border-bottom: 2px solid var(--oro); }
        .ticker-wrap { background: var(--oro); padding: 8px; overflow: hidden; white-space: nowrap; }
        .ticker-content { display: inline-block; animation: ticker 30s linear infinite; font-weight: bold; color: var(--verde-selva); }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        main { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .portada-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 4px; margin-bottom: 20px; border: 2px solid var(--texto); }
        .articulo-principal { background: var(--verde-selva); padding: 40px; min-height: 350px; color: white; cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: flex-end; }
        .art-secundario { background: var(--crema-oscuro); padding: 20px; border-bottom: 1px solid var(--oro); cursor: pointer; }
        .ia-panel { background: var(--verde-selva); border: 2px solid var(--oro); padding: 20px; margin: 20px 0; color: white; }
        .ia-controles { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .ia-select, .ia-input { background: rgba(255,255,255,0.1); border: 1px solid var(--oro); color: white; padding: 10px; flex: 1; }
        .ia-btn { background: var(--oro); border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .articulos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .tarjeta { background: white; border: 1px solid #ddd; cursor: pointer; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: var(--crema); max-width: 800px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 30px; position: relative; border-top: 5px solid var(--oro); }
        .modal-cerrar { position: absolute; top: 10px; right: 20px; font-size: 2rem; cursor: pointer; border: none; background: none; }
        footer { background: var(--verde-selva); color: white; text-align: center; padding: 30px; border-top: 4px solid var(--oro); }
    </style>
</head>
<body>

<header>
    <div class="header-top"><span id="fecha-actual"></span><span>Edición Digital · VIBRAS POSITIVAS HM</span></div>
    <div class="header-main"><div class="revista-nombre">El Cauca</div></div>
    <nav class="secciones">
        <button class="activo" onclick="filtrarSeccion('todo', this)">Todo</button>
        <button onclick="filtrarSeccion('region', this)">Región</button>
        <button onclick="filtrarSeccion('economia', this)">Economía</button>
        <button onclick="filtrarSeccion('cultura', this)">Cultura</button>
    </nav>
</header>

<div class="ticker-wrap"><div class="ticker-content" id="ticker-text"></div></div>

<main>
    <div class="portada-grid" id="portada-grid"></div>
    <div class="ia-panel">
        <h3>✍️ GENERADOR DE ARTÍCULOS IA</h3>
        <div class="ia-controles">
            <select class="ia-select" id="ia-categoria">
                <option value="region">Región</option>
                <option value="economia">Economía</option>
                <option value="cultura">Cultura</option>
            </select>
            <input class="ia-input" id="ia-tema" type="text" placeholder="¿Qué tema quieres generar?">
            <button class="ia-btn" id="ia-generar-btn" onclick="generarArticuloIA()">GENERAR</button>
        </div>
        <div id="ia-articulo-generado" style="margin-top:15px;"></div>
    </div>
    <div class="articulos-grid" id="articulos-grid"></div>
</main>

<footer><p>Desarrollado por <b>VIBRAS POSITIVAS HM</b> © 2026</p></footer>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target==this) cerrarModal()">
    <div class="modal">
        <button class="modal-cerrar" onclick="cerrarModal()">×</button>
        <h2 id="modal-titulo"></h2>
        <div id="modal-cuerpo" style="margin-top:20px; line-height:1.6;"></div>
    </div>
</div>

<script>
const API_KEY = "AIzaSyB_1RbhOVsXQ5zzBfp36p16LzKKfvSznYs";
let ARTICULOS = [
    { id: 1, seccion: 'region', titulo: 'Caucasia: Corazón del Norte', resumen: 'Epicentro comercial del Bajo Cauca.', cuerpo: '<p>Caucasia lidera el desarrollo regional con su estratégica ubicación.</p>', categoria: 'REGIÓN' },
    { id: 2, seccion: 'economia', titulo: 'El futuro de la minería', resumen: 'Nuevas leyes para el Bagre.', cuerpo: '<p>La minería busca ser sostenible en Zaragoza y el Bagre.</p>', categoria: 'ECONOMÍA' }
];

function actualizarReloj() {
    const ahora = new Date().toLocaleString('es-CO', { timeZone: 'America/Bogota', weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    document.getElementById('fecha-actual').textContent = ahora;
}

function renderUI(data = ARTICULOS) {
    const port = document.getElementById('portada-grid');
    const grid = document.getElementById('articulos-grid');
    const tkr = document.getElementById('ticker-text');

    if (data.length > 0) {
        const p = data[0];
        port.innerHTML = `
            <div class="articulo-principal" onclick="abrirModal(${p.id})">
                <span style="color:var(--oro-claro)">${p.categoria}</span>
                <h2>${p.titulo}</h2>
            </div>
            <div class="portada-lateral">
                ${data.slice(1, 3).map(a => `<div class="art-secundario" onclick="abrirModal(${a.id})"><h4>${a.titulo}</h4></div>`).join('')}
            </div>`;
    }

    grid.innerHTML = data.slice(3).map(a => `
        <div class="tarjeta" onclick="abrirModal(${a.id})" style="padding:15px;">
            <h4>${a.titulo}</h4><p>${a.resumen}</p>
        </div>`).join('');

    tkr.textContent = ARTICULOS.map(a => a.titulo).join(' /// ');
}

function filtrarSeccion(sec, btn) {
    document.querySelectorAll('nav.secciones button').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    const filtrados = sec === 'todo' ? ARTICULOS : ARTICULOS.filter(a => a.seccion === sec);
    renderUI(filtrados);
}

async function generarArticuloIA() {
    const btn = document.getElementById('ia-generar-btn');
    const tema = document.getElementById('ia-tema').value;
    const cat = document.getElementById('ia-categoria').value;
    const res = document.getElementById('ia-articulo-generado');

    if(!tema) return alert("Escribe un tema");
    
    btn.disabled = true;
    res.innerHTML = "✍️ Generando con VIBRAS POSITIVAS HM...";

    const prompt = `Actúa como editor de "El Cauca". Escribe un artículo sobre ${tema} en la región del Bajo Cauca. Responde SOLO en JSON: {"titulo":"","resumen":"","cuerpo":"<p>...</p>","categoria":"${cat.toUpperCase()}"}`;

    try {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const d = await resp.json();
        const texto = d.candidates[0].content.parts[0].text.replace(/```json|```/g, "");
        const art = JSON.parse(texto);
        art.id = Date.now();
        art.seccion = cat;
        ARTICULOS.unshift(art);
        res.innerHTML = `<b style="color:var(--oro-claro)">✅ Generado: ${art.titulo}</b>`;
        renderUI();
    } catch (e) {
        res.innerHTML = "❌ Error al generar.";
    } finally { btn.disabled = false; }
}

function abrirModal(id) {
    const a = ARTICULOS.find(x => x.id === id);
    document.getElementById('modal-titulo').textContent = a.titulo;
    document.getElementById('modal-cuerpo').innerHTML = a.cuerpo;
    document.getElementById('modal-overlay').style.display = 'flex';
}

function cerrarModal() { document.getElementById('modal-overlay').style.display = 'none'; }

actualizarReloj();
setInterval(actualizarReloj, 1000);
renderUI();
</script>
</body>
</html>
