<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cauca — Revista Digital del Bajo Cauca Antioqueño</title>

    <meta name="theme-color" content="#1A3A2A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="El Cauca">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --oro: #C8962A;
            --oro-claro: #E8B84B;
            --verde-selva: #1A3A2A;
            --verde-medio: #2D5A3D;
            --tierra: #8B4513;
            --crema: #F5EDD8;
            --crema-oscuro: #E8D5B0;
            --texto: #1A1A18;
            --blanco: #FAFAF7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Source Serif 4', serif; background: var(--crema); color: var(--texto); overflow-x: hidden; }

        header { background: var(--verde-selva); border-bottom: 4px solid var(--oro); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .header-top { display: flex; justify-content: space-between; padding: 8px 24px; border-bottom: 1px solid rgba(200,150,42,0.3); font-size: 0.72rem; color: var(--crema-oscuro); }
        .header-main { display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 18px 24px 14px; text-align: center; }
        .revista-nombre { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 10vw, 6rem); color: var(--crema); letter-spacing: 0.12em; line-height: 0.9; }
        .revista-subtitulo { font-family: 'Playfair Display', serif; font-style: italic; color: var(--oro-claro); font-size: clamp(0.8rem, 2vw, 1.1rem); margin-top: 4px; }

        nav.secciones { display: flex; justify-content: center; background: rgba(0,0,0,0.2); flex-wrap: wrap; }
        nav.secciones button { background: none; border: none; color: var(--crema-oscuro); padding: 12px 18px; font-size: 0.78rem; text-transform: uppercase; cursor: pointer; transition: 0.2s; border-bottom: 2px solid transparent; }
        nav.secciones button.activo { color: var(--oro-claro); border-bottom-color: var(--oro); background: rgba(200,150,42,0.08); }

        .ticker-wrap { background: var(--oro); padding: 6px 0; overflow: hidden; border-bottom: 2px solid var(--verde-selva); white-space: nowrap; }
        .ticker-content { display: inline-block; animation: ticker 40s linear infinite; font-size: 0.82rem; font-weight: 600; color: var(--verde-selva); }
        @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

        main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 40px; }
        .portada-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2px; margin-bottom: 32px; border: 2px solid var(--texto); }
        @media(max-width:700px){ .portada-grid { grid-template-columns: 1fr; } }

        .articulo-principal { background: var(--verde-selva); padding: 32px; min-height: 400px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden; cursor: pointer; }
        .articulo-principal::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(26,58,42,0.3) 0%, rgba(26,58,42,0.85) 60%); z-index: 1; }
        .articulo-principal .emoji-bg { position: absolute; top: 0; left: 0; font-size: 10rem; opacity: 0.12; z-index: 0; }
        .art-etiqueta { font-family: 'Bebas Neue', sans-serif; font-size: 0.75rem; color: var(--oro-claro); background: rgba(200,150,42,0.2); border: 1px solid var(--oro); padding: 3px 10px; margin-bottom: 12px; position: relative; z-index: 2; width: fit-content; }
        .articulo-principal h2 { font-family: 'Playfair Display', serif; font-size: clamp(1.4rem, 3vw, 2.2rem); color: var(--crema); position: relative; z-index: 2; margin-bottom: 12px; }

        .art-secundario { background: var(--crema-oscuro); padding: 18px; border-left: 3px solid var(--oro); cursor: pointer; }
        .articulos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .tarjeta { background: var(--blanco); border: 1px solid #d4c49a; cursor: pointer; transition: 0.2s; }
        .tarjeta:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.15); }
        .tarjeta-imagen { height: 160px; background: var(--verde-selva); display: flex; align-items: center; justify-content: center; font-size: 3rem; }

        .ia-panel { background: var(--verde-selva); border: 2px solid var(--oro); padding: 28px; margin: 32px 0; color: var(--crema); }
        .ia-titulo { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--oro-claro); margin-bottom: 10px; }
        .ia-controles { display: flex; gap: 10px; flex-wrap: wrap; }
        .ia-select, .ia-input { background: rgba(255,255,255,0.1); border: 1px solid var(--oro); color: white; padding: 10px; flex: 1; min-width: 200px; }
        .ia-btn { background: var(--oro); border: none; color: var(--verde-selva); padding: 10px 25px; font-family: 'Bebas Neue', sans-serif; cursor: pointer; font-size: 1.1rem; }
        .ia-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .ia-articulo-generado { margin-top: 20px; border-left: 4px solid var(--oro-claro); padding-left: 20px; }
        .loading { animation: pulsar 1.5s infinite; color: var(--oro-claro); font-style: italic; }
        @keyframes pulsar { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.abierto { display: flex; }
        .modal { background: var(--crema); max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 40px; position: relative; border-top: 8px solid var(--oro); }
        .modal-cerrar { position: absolute; top: 10px; right: 20px; font-size: 2rem; cursor: pointer; border: none; background: none; }
        .modal-cuerpo p { margin-bottom: 1.5rem; line-height: 1.8; font-size: 1.1rem; }

        footer { background: var(--verde-selva); color: var(--crema); padding: 40px 20px; text-align: center; border-top: 4px solid var(--oro); }
        .footer-credito span { color: var(--oro-claro); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <span id="fecha-actual">Cargando...</span>
        <span>Edición Digital · Bajo Cauca Antioqueño</span>
    </div>
    <div class="header-main">
        <div class="revista-nombre">El Cauca</div>
        <div class="revista-subtitulo">Revista Digital del Bajo Cauca Antioqueño</div>
    </div>
    <nav class="secciones">
        <button class="activo" onclick="filtrarSeccion('todo',this)">Todo</button>
        <button onclick="filtrarSeccion('region',this)">Región</button>
        <button onclick="filtrarSeccion('economia',this)">Economía</button>
        <button onclick="filtrarSeccion('cultura',this)">Cultura</button>
        <button onclick="filtrarSeccion('historia',this)">Historia</button>
    </nav>
</header>

<div class="ticker-wrap">
    <div class="ticker-content" id="ticker-text">Cargando titulares...</div>
</div>

<main>
    <div class="portada-grid" id="portada-grid"></div>

    <div class="ia-panel">
        <div class="ia-titulo">✍️ GENERADOR DE ARTÍCULOS VIBRAS POSITIVAS HM</div>
        <div class="ia-controles">
            <select class="ia-select" id="ia-categoria">
                <option value="region">Actualidad Regional</option>
                <option value="economia">Economía y Minería</option>
                <option value="cultura">Cultura y Tradiciones</option>
                <option value="historia">Historia del Bajo Cauca</option>
            </select>
            <input class="ia-input" id="ia-tema" type="text" placeholder="¿Sobre qué quieres leer hoy?">
            <button class="ia-btn" id="ia-generar-btn" onclick="generarArticuloIA()">GENERAR</button>
        </div>
        <div id="ia-resultado" style="display:none;">
            <div class="ia-articulo-generado" id="ia-articulo-generado"></div>
        </div>
    </div>

    <div class="articulos-grid" id="articulos-grid"></div>
</main>

<footer>
    <div class="footer-logo">EL CAUCA</div>
    <div class="footer-credito">
        Desarrollado por <span>VIBRAS POSITIVAS HM</span><br>
        © 2026 Todos los derechos reservados.
    </div>
</footer>

<div class="modal-overlay" id="modal-overlay" onclick="cerrarModal(event)">
    <div class="modal">
        <button class="modal-cerrar" onclick="cerrarModalBtn()">×</button>
        <span class="art-etiqueta" id="modal-etiqueta"></span>
        <h2 id="modal-titulo" style="font-family:'Playfair Display', serif; margin: 15px 0;"></h2>
        <div class="modal-cuerpo" id="modal-cuerpo"></div>
    </div>
</div>

<script>
const API_KEY = "AIzaSyB_1RbhOVsXQ5zzBfp36p16LzKKfvSznYs";
let ultimoDiaRefresco = new Date().getDate();

const ARTICULOS_BASE = [
    {
        id: 1, seccion: 'region', emoji: '🏙️',
        titulo: 'Caucasia: Corazón estratégico del Norte',
        resumen: 'La ciudad se consolida como el epicentro comercial más importante entre Medellín y la Costa.',
        cuerpo: '<p>Caucasia no es solo una parada en el camino; es el motor que impulsa el comercio del Bajo Cauca. Con su infraestructura en crecimiento y su posición a orillas del río, atrae inversionistas y académicos.</p><p>El desarrollo urbano reciente ha permitido que nuevos barrios y centros comerciales florezcan, manteniendo siempre esa esencia cálida de su gente.</p>',
        categoria: 'REGIÓN', fecha: hoy()
    },
    {
        id: 2, seccion: 'economia', emoji: '⛏️',
        titulo: 'El futuro de la minería ancestral',
        resumen: 'Zaragoza y El Bagre buscan formalizar la extracción de oro para proteger el ecosistema.',
        cuerpo: '<p>La minería ha sido el alma de Zaragoza desde tiempos coloniales. Hoy, el reto es transformar esta práctica en una actividad sostenible.</p><p>Programas estatales buscan que los mineros tradicionales utilicen tecnologías libres de mercurio.</p>',
        categoria: 'ECONOMÍA', fecha: hoy()
    }
];

function hoy() { return new Date().toLocaleDateString('es-CO', { year:'numeric', month:'long', day:'numeric' }); }

function actualizarReloj() {
    const ahora = new Date();
    const ahoraCO = new Intl.DateTimeFormat('es-CO', { 
        weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone:'America/Bogota' 
    }).format(ahora);
    document.getElementById('fecha-actual').textContent = ahoraCO;

    // REFRESCO AL MEDIODÍA
    if (ahora.getHours() === 12 && ahora.getMinutes() === 0 && ahora.getDate() !== ultimoDiaRefresco) {
        ultimoDiaRefresco = ahora.getDate();
        location.reload();
    }
}

async function generarArticuloIA() {
    const btn = document.getElementById('ia-generar-btn');
    const tema = document.getElementById('ia-tema').value;
    const cat = document.getElementById('ia-categoria').value;
    const cont = document.getElementById('ia-articulo-generado');
    
    btn.disabled = true;
    document.getElementById('ia-resultado').style.display = 'block';
    cont.innerHTML = '<div class="loading">✍️ VIBRAS POSITIVAS HM está redactando...</div>';

    const prompt = `Actúa como periodista experto en el Bajo Cauca Antioqueño. Escribe un artículo COMPLETO y EXTENSO sobre ${cat}: ${tema}. 
    Responde solo con este JSON: {"titulo":"","subtitulo":"","cuerpo":"<p>párrafo 1</p><p>párrafo 2</p><p>párrafo 3</p>","emoji":"","categoria":""}`;

    try {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await resp.json();
        const json = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, ""));
        
        const nuevo = { ...json, id: Date.now(), fecha: hoy(), seccion: cat };
        ARTICULOS_BASE.unshift(nuevo);
        
        cont.innerHTML = `<h3>${json.emoji} ${json.titulo}</h3>${json.cuerpo}`;
        renderUI();
    } catch (e) {
        cont.innerHTML = "⚠️ Error al conectar con la IA.";
    } finally {
        btn.disabled = false;
    }
}

function renderUI() {
    const port = document.getElementById('portada-grid');
    const grid = document.getElementById('articulos-grid');
    const tkr = document.getElementById('ticker-text');

    const p = ARTICULOS_BASE[0];
    port.innerHTML = `
        <div class="articulo-principal" onclick="abrirModal(${p.id})">
            <div class="emoji-bg">${p.emoji}</div>
            <span class="art-etiqueta">${p.categoria}</span>
            <h2>${p.titulo}</h2>
        </div>
        <div class="portada-lateral">${ARTICULOS_BASE.slice(1,3).map(a => `<div class="art-secundario" onclick="abrirModal(${a.id})"><h4>${a.titulo}</h4></div>`).join('')}</div>
    `;

    grid.innerHTML = ARTICULOS_BASE.slice(3).map(a => `
        <div class="tarjeta" onclick="abrirModal(${a.id})">
            <div class="tarjeta-imagen">${a.emoji}</div>
            <div style="padding:15px"><h4>${a.titulo}</h4><p style="font-size:0.8rem">${a.resumen}</p></div>
        </div>
    `).join('');

    tkr.textContent = ARTICULOS_BASE.map(a => a.titulo).join('  ///  ');
}

function abrirModal(id) {
    const a = ARTICULOS_BASE.find(x => x.id === id);
    document.getElementById('modal-titulo').textContent = a.titulo;
    document.getElementById('modal-cuerpo').innerHTML = a.cuerpo;
    document.getElementById('modal-etiqueta').textContent = a.categoria;
    document.getElementById('modal-overlay').classList.add('abierto');
}

function cerrarModalBtn() { document.getElementById('modal-overlay').classList.remove('abierto'); }
function cerrarModal(e) { if(e.target.classList.contains('modal-overlay')) cerrarModalBtn(); }

setInterval(actualizarReloj, 1000);
renderUI();
</script>
</body>
</html>
