<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cauca — Revista Digital del Bajo Cauca Antioqueño</title>

    <meta name="theme-color" content="#1A3A2A">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --oro: #C8962A; --oro-claro: #E8B84B; --verde-selva: #1A3A2A;
            --crema: #F5EDD8; --crema-oscuro: #E8D5B0; --texto: #1A1A18; --blanco: #FAFAF7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Source Serif 4', serif; background: var(--crema); color: var(--texto); line-height: 1.6; }
        
        /* HEADER */
        header { background: var(--verde-selva); border-bottom: 4px solid var(--oro); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .header-top { display: flex; justify-content: space-between; padding: 8px 24px; font-size: 0.72rem; color: var(--crema-oscuro); border-bottom: 1px solid rgba(200,150,42,0.2); }
        .header-main { padding: 20px; text-align: center; }
        .revista-nombre { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 8vw, 5rem); color: var(--crema); letter-spacing: 0.1em; }
        
        nav.secciones { display: flex; justify-content: center; background: rgba(0,0,0,0.2); flex-wrap: wrap; }
        nav.secciones button { background: none; border: none; color: var(--crema-oscuro); padding: 15px 20px; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; font-weight: 600; transition: 0.3s; }
        nav.secciones button.activo { color: var(--oro-claro); border-bottom: 3px solid var(--oro); background: rgba(255,255,255,0.05); }

        /* TICKER */
        .ticker-wrap { background: var(--oro); padding: 10px; overflow: hidden; white-space: nowrap; border-bottom: 2px solid var(--verde-selva); }
        .ticker-content { display: inline-block; animation: ticker 40s linear infinite; font-weight: 900; color: var(--verde-selva); font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* MAIN LAYOUT */
        main { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .portada-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 4px; margin-bottom: 30px; border: 3px solid var(--texto); background: var(--texto); }
        .articulo-principal { background: var(--verde-selva); padding: 40px; min-height: 400px; color: white; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; transition: 0.3s; }
        .articulo-principal:hover { filter: brightness(1.2); }
        .articulo-principal h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; line-height: 1.1; margin: 10px 0; }
        
        .portada-lateral { display: flex; flex-direction: column; gap: 4px; }
        .art-secundario { background: var(--crema-oscuro); padding: 25px; flex: 1; cursor: pointer; transition: 0.3s; border-left: 5px solid var(--oro); }
        .art-secundario:hover { background: var(--blanco); }

        /* IA PANEL */
        .ia-panel { background: var(--verde-selva); border: 2px solid var(--oro); padding: 30px; margin: 40px 0; color: white; border-radius: 4px; }
        .ia-panel h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--oro-claro); margin-bottom: 15px; }
        .ia-controles { display: flex; gap: 15px; flex-wrap: wrap; }
        .ia-select, .ia-input { background: rgba(255,255,255,0.1); border: 1px solid var(--oro); color: white; padding: 12px; flex: 1; min-width: 250px; font-family: 'Source Serif 4', serif; }
        .ia-btn { background: var(--oro); border: none; padding: 12px 30px; cursor: pointer; font-weight: 900; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; transition: 0.3s; }
        .ia-btn:hover { background: var(--oro-claro); transform: scale(1.05); }
        .ia-btn:disabled { background: #666; cursor: not-allowed; }

        /* GRID */
        .articulos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .tarjeta { background: white; border: 1px solid #ddd; cursor: pointer; padding: 25px; border-top: 5px solid var(--verde-selva); transition: 0.3s; }
        .tarjeta:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: var(--crema); max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 50px; position: relative; border-top: 10px solid var(--oro); box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .modal-cerrar { position: absolute; top: 15px; right: 25px; font-size: 3rem; cursor: pointer; border: none; background: none; color: var(--verde-selva); }
        #modal-cuerpo p { margin-bottom: 20px; font-size: 1.15rem; text-align: justify; }

        footer { background: var(--verde-selva); color: white; text-align: center; padding: 50px; border-top: 5px solid var(--oro); margin-top: 50px; }
        
        .loading { color: var(--oro-claro); font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <span id="fecha-actual"></span>
        <span>BAJO CAUCA ANTIOQUEÑO · COLOMBIA</span>
    </div>
    <div class="header-main">
        <div class="revista-nombre">El Cauca</div>
    </div>
    <nav class="secciones">
        <button class="activo" onclick="filtrarSeccion('todo', this)">Todo</button>
        <button onclick="filtrarSeccion('region', this)">Región</button>
        <button onclick="filtrarSeccion('economia', this)">Economía</button>
        <button onclick="filtrarSeccion('cultura', this)">Cultura</button>
    </nav>
</header>

<div class="ticker-wrap"><div class="ticker-content" id="ticker-text"></div></div>

<main>
    <div class="portada-grid" id="portada-grid"></div>

    <div class="ia-panel">
        <h3>✍️ GENERADOR DE INFORMES ESPECIALES VIBRAS POSITIVAS HM</h3>
        <div class="ia-controles">
            <select class="ia-select" id="ia-categoria">
                <option value="region">Actualidad Regional</option>
                <option value="economia">Economía y Minería</option>
                <option value="cultura">Cultura y Tradiciones</option>
            </select>
            <input class="ia-input" id="ia-tema" type="text" placeholder="Escribe un tema (ej: El impacto del río Cauca en la pesca)">
            <button class="ia-btn" id="ia-generar-btn" onclick="generarArticuloIA()">GENERAR INFORME</button>
        </div>
        <div id="ia-articulo-generado" style="margin-top:20px; border-left: 3px solid var(--oro-claro); padding-left: 15px;"></div>
    </div>

    <div class="articulos-grid" id="articulos-grid"></div>
</main>

<footer>
    <p style="font-family: 'Bebas Neue'; font-size: 1.5rem; letter-spacing: 2px;">VIBRAS POSITIVAS HM</p>
    <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 10px;">© 2026 · Todos los derechos reservados · Caucasia, Antioquia</p>
</footer>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target==this) cerrarModal()">
    <div class="modal">
        <button class="modal-cerrar" onclick="cerrarModal()">×</button>
        <h2 id="modal-titulo" style="font-family: 'Playfair Display'; font-size: 2.5rem; margin-bottom: 10px;"></h2>
        <div id="modal-cuerpo"></div>
    </div>
</div>

<script>
const API_KEY = "AIzaSyB_1RbhOVsXQ5zzBfp36p16LzKKfvSznYs";

// Base de datos inicial
let ARTICULOS = [
    { 
        id: 1, seccion: 'region', 
        titulo: 'Caucasia: El despertar de la Capital del Bajo Cauca', 
        resumen: 'Análisis sobre el crecimiento urbano y los retos de seguridad en el corazón del territorio.', 
        cuerpo: '<p>Caucasia se erige hoy como el centro neurálgico de una subregión que no se detiene. Con más de 100.000 habitantes, la ciudad enfrenta el desafío de modernizar su infraestructura vial para conectar de forma eficiente con la troncal de occidente.</p><p>Expertos señalan que el puerto fluvial sigue siendo una oportunidad desaprovechada que podría dinamizar el transporte de carga hacia el Caribe colombiano.</p>', 
        categoria: 'REGIÓN' 
    },
    { 
        id: 2, seccion: 'economia', 
        titulo: 'Minería en El Bagre: Hacia la formalización total', 
        resumen: 'Nuevas cooperativas mineras buscan erradicar el uso de mercurio en la extracción de oro.', 
        cuerpo: '<p>En los yacimientos de El Bagre y Zaragoza, el panorama está cambiando. La transición hacia una minería de "cero mercurio" no solo es una exigencia legal, sino una necesidad ambiental para proteger las ciénagas del Nechí.</p><p>Las mesas de diálogo entre pequeños mineros y el Gobierno Nacional han permitido trazar una hoja de ruta para la legalización de títulos ancestrales.</p>', 
        categoria: 'ECONOMÍA' 
    }
];

function actualizarReloj() {
    const ahora = new Date().toLocaleString('es-CO', { 
        timeZone: 'America/Bogota', weekday: 'long', day: 'numeric', month: 'long', 
        hour: '2-digit', minute: '2-digit', hour12: true 
    });
    document.getElementById('fecha-actual').textContent = ahora.toUpperCase();
}

function renderUI(data = ARTICULOS) {
    const port = document.getElementById('portada-grid');
    const grid = document.getElementById('articulos-grid');
    const tkr = document.getElementById('ticker-text');

    if (data.length > 0) {
        const p = data[0];
        port.innerHTML = `
            <div class="articulo-principal" onclick="abrirModal(${p.id})">
                <span style="color:var(--oro-claro); font-weight: bold; border-bottom: 2px solid var(--oro);">${p.categoria}</span>
                <h2>${p.titulo}</h2>
                <p style="opacity: 0.9;">${p.resumen}</p>
            </div>
            <div class="portada-lateral">
                ${data.slice(1, 3).map(a => `
                    <div class="art-secundario" onclick="abrirModal(${a.id})">
                        <small style="color:var(--verde-selva); font-weight: bold;">${a.categoria}</small>
                        <h4 style="font-family: 'Playfair Display'; font-size: 1.2rem; margin-top:5px;">${a.titulo}</h4>
                    </div>
                `).join('')}
            </div>`;
    }

    grid.innerHTML = data.slice(3).map(a => `
        <div class="tarjeta" onclick="abrirModal(${a.id})">
            <small style="color:var(--oro); font-weight: bold;">${a.categoria}</small>
            <h4 style="font-family: 'Playfair Display'; font-size: 1.4rem; margin: 10px 0;">${a.titulo}</h4>
            <p style="font-size: 0.9rem; color: #555;">${p.resumen}</p>
        </div>`).join('');

    tkr.textContent = ARTICULOS.map(a => a.titulo.toUpperCase()).join('  ///  ');
}

async function generarArticuloIA() {
    const btn = document.getElementById('ia-generar-btn');
    const tema = document.getElementById('ia-tema').value;
    const cat = document.getElementById('ia-categoria').value;
    const res = document.getElementById('ia-articulo-generado');

    if(!tema) return alert("Por favor, introduce un tema para desarrollar el informe.");
    
    btn.disabled = true;
    res.innerHTML = "<span class='loading'>✍️ VIBRAS POSITIVAS HM REDACTANDO INFORME PROFUNDO...</span>";

    // PROMPT OPTIMIZADO PARA EXTENSIÓN MÁXIMA
    const prompt = `Actúa como el Director Editorial de la revista "El Cauca". 
    Escribe un artículo PERIODÍSTICO EXTENSO, PROFESIONAL Y DETALLADO sobre: ${tema}. 
    CONTEXTO: Bajo Cauca Antioqueño.
    REGLAS:
    - Mínimo 5 párrafos largos (100 palabras cada uno).
    - Incluye datos históricos, análisis social y conclusiones.
    - Usa un lenguaje culto y periodístico.
    - Devuelve SOLO un objeto JSON con estas llaves: "titulo", "resumen", "cuerpo", "categoria" (donde cuerpo debe tener etiquetas <p> para cada párrafo largo).
    Categoría sugerida: ${cat.toUpperCase()}`;

    try {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { maxOutputTokens: 2500, temperature: 0.7 } 
            })
        });
        const d = await resp.json();
        const rawText = d.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
        const art = JSON.parse(rawText);
        
        art.id = Date.now();
        art.seccion = cat;
        ARTICULOS.unshift(art);
        
        res.innerHTML = `<b style="color:var(--oro-claro)">✅ INFORME PUBLICADO: ${art.titulo}</b>`;
        renderUI();
    } catch (e) {
        console.error(e);
        res.innerHTML = "❌ Error en el proceso de redacción. Intenta de nuevo.";
    } finally { btn.disabled = false; }
}

function filtrarSeccion(sec, btn) {
    document.querySelectorAll('nav.secciones button').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    const filtrados = sec === 'todo' ? ARTICULOS : ARTICULOS.filter(a => a.seccion === sec);
    renderUI(filtrados);
}

function abrirModal(id) {
    const a = ARTICULOS.find(x => x.id === id);
    document.getElementById('modal-titulo').textContent = a.titulo;
    document.getElementById('modal-cuerpo').innerHTML = a.cuerpo;
    document.getElementById('modal-overlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function cerrarModal() { 
    document.getElementById('modal-overlay').style.display = 'none'; 
    document.body.style.overflow = 'auto';
}

// Lógica de actualización al mediodía (PWA)
function checkMediodia() {
    const ahora = new Date();
    if (ahora.getHours() === 12 && ahora.getMinutes() === 0) {
        location.reload();
    }
}

actualizarReloj();
setInterval(actualizarReloj, 1000);
setInterval(checkMediodia, 60000);
renderUI();
</script>
</body>
</html>
